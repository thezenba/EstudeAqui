  <rect x="155" y="310" width="180" height="12" fill="#000000"/>

  <circle cx="125" cy="362" r="14" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="120" y="368" font-family="monospace" font-size="16" font-weight="bold" fill="#000">C</text>
  <rect x="155" y="356" width="230" height="12" fill="#444444"/>

  <circle cx="125" cy="408" r="14" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="120" y="414" font-family="monospace" font-size="16" font-weight="bold" fill="#000">D</text>
