<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#222222" rx="64"/>
  <rect x="32" y="32" width="448" height="448" fill="#ffffff" rx="32"/>
  <rect x="48" y="48" width="416" height="416" fill="#c0c0c0" rx="16"/>
  <!-- Barra de título retrô -->
  <rect x="64" y="64" width="384" height="48" fill="#333333"/>
  <rect x="76" y="76" width="24" height="24" fill="#ffffff"/>
  <rect x="412" y="74" width="24" height="26" fill="#c0c0c0" stroke="#000" stroke-width="2"/>
